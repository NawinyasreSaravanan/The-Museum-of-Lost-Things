<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-09" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-09" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-09)" />
  <rect width="600" height="450" fill="url(#grid-09)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#E29B38" />
  <circle cx="580" cy="20" r="2" fill="#E29B38" />
  <circle cx="20" cy="430" r="2" fill="#E29B38" />
  <circle cx="580" cy="430" r="2" fill="#E29B38" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 09</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#E29B38" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2018</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Cafe Napkin Note 2018 -->
      <g filter="url(#shadow-09)" transform="translate(170, 100) rotate(-4)">
        <rect x="0" y="0" width="260" height="230" fill="#FFFFFF" stroke="#DDD6C7" stroke-width="1.5" />
        <text x="30" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="10" fill="#BBB" letter-spacing="2">PORTOBELLO ESPRESSO</text>
        <text x="30" y="100" font-family="'Cormorant Garamond', serif" font-size="18" font-style="italic" fill="#181716">“Meet me where the</text>
        <text x="30" y="130" font-family="'Cormorant Garamond', serif" font-size="18" font-style="italic" fill="#181716">streetlights end.</text>
        <text x="30" y="170" font-family="'Cormorant Garamond', serif" font-size="18" font-style="italic" fill="#E03E2D">Do not bring the umbrella.”</text>
        <text x="30" y="205" font-family="'Space Mono', monospace" font-size="8" fill="#AAA">14.11.2018 · 21:15</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>