<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-10" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-10" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-10)" />
  <rect width="600" height="450" fill="url(#grid-10)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#E03E2D" />
  <circle cx="580" cy="20" r="2" fill="#E03E2D" />
  <circle cx="20" cy="430" r="2" fill="#E03E2D" />
  <circle cx="580" cy="430" r="2" fill="#E03E2D" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 10</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#E03E2D" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2017</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Smartwatch with Cracked Screen 2017 -->
      <g filter="url(#shadow-10)" transform="translate(200, 80)">
        <rect x="65" y="0" width="70" height="280" rx="10" fill="#2E2D2B" />
        <rect x="40" y="60" width="120" height="140" rx="28" fill="#11100F" stroke="#444" stroke-width="2" />
        <rect x="48" y="68" width="104" height="124" rx="20" fill="#050505" />
        <text x="100" y="125" font-family="'Space Mono', monospace" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04:17</text>
        <text x="100" y="150" font-family="'Space Mono', monospace" font-size="9" fill="#E03E2D" text-anchor="middle">OCTOBER 18</text>
        <!-- Cracked crystal path -->
        <path d="M 55 90 L 105 120 L 140 100 M 105 120 L 115 170" stroke="#7AE2FF" stroke-width="1.8" fill="none" opacity="0.8" />
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>