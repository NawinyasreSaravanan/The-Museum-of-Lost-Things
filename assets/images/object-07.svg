<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-07" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-07" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-07)" />
  <rect width="600" height="450" fill="url(#grid-07)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#2D68C4" />
  <circle cx="580" cy="20" r="2" fill="#2D68C4" />
  <circle cx="20" cy="430" r="2" fill="#2D68C4" />
  <circle cx="580" cy="430" r="2" fill="#2D68C4" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 07</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#2D68C4" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2007</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- SD Card 2007 -->
      <g filter="url(#shadow-07)" transform="translate(200, 110) rotate(5)">
        <polygon points="0,0 160,0 180,20 180,220 0,220" fill="#1E3A8A" stroke="#172554" stroke-width="2" />
        <rect x="20" y="25" width="140" height="100" rx="4" fill="#FFFFFF" />
        <text x="30" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#E03E2D">ULTRA II</text>
        <text x="30" y="80" font-family="'Space Mono', monospace" font-size="16" font-weight="bold" fill="#181716">128 MB</text>
        <text x="30" y="105" font-family="'Space Mono', monospace" font-size="8.5" fill="#666">SD MEMORY CARD · 2007</text>
        <g transform="translate(25, 170)">
          <rect x="0" y="0" width="12" height="30" rx="2" fill="#D4AF37" />
          <rect x="18" y="0" width="12" height="30" rx="2" fill="#D4AF37" />
          <rect x="36" y="0" width="12" height="30" rx="2" fill="#D4AF37" />
          <rect x="54" y="0" width="12" height="30" rx="2" fill="#D4AF37" />
        </g>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>