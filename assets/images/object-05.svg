<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-05" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-05" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-05)" />
  <rect width="600" height="450" fill="url(#grid-05)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#E29B38" />
  <circle cx="580" cy="20" r="2" fill="#E29B38" />
  <circle cx="20" cy="430" r="2" fill="#E29B38" />
  <circle cx="580" cy="430" r="2" fill="#E29B38" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 05</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#E29B38" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2002</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Burnt CD-R Mixtape 2002 -->
      <g filter="url(#shadow-05)" transform="translate(190, 100)">
        <circle cx="110" cy="110" r="105" fill="#EAEBF0" stroke="#B0B6C2" stroke-width="2" />
        <circle cx="110" cy="110" r="85" fill="none" stroke="#D1D6E2" stroke-width="1" />
        <!-- Prismatic Rainbow reflection ring -->
        <circle cx="110" cy="110" r="60" fill="none" stroke="#68C7BE" stroke-width="8" opacity="0.35" />
        <circle cx="110" cy="110" r="50" fill="none" stroke="#E03E2D" stroke-width="6" opacity="0.25" />
        <circle cx="110" cy="110" r="32" fill="#FCFAF7" stroke="#9FA6B3" stroke-width="1.5" />
        <circle cx="110" cy="110" r="16" fill="#F7F4EB" stroke="#7A808C" stroke-width="1.5" />
        <!-- Sharpie handwriting on disc -->
        <text x="110" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#181716" text-anchor="middle">"Summer Mix '02 - Vol. 3"</text>
        <text x="110" y="170" font-family="'Space Mono', monospace" font-size="8.5" fill="#4A4640" text-anchor="middle">DO NOT ERASE · 700MB / 80MIN</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>