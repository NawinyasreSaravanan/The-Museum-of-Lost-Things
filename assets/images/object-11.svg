<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-11" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-11" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-11)" />
  <rect width="600" height="450" fill="url(#grid-11)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#2E8B82" />
  <circle cx="580" cy="20" r="2" fill="#2E8B82" />
  <circle cx="20" cy="430" r="2" fill="#2E8B82" />
  <circle cx="580" cy="430" r="2" fill="#2E8B82" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 11</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#2E8B82" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2009</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Transit Napkin Map 2009 -->
      <g filter="url(#shadow-11)" transform="translate(170, 95) rotate(2)">
        <rect x="0" y="0" width="260" height="240" fill="#FAF7F0" stroke="#C5BCAE" stroke-width="1.5" />
        <path d="M 30 120 Q 120 70 230 130" stroke="#2D68C4" stroke-width="6" fill="none" stroke-linecap="round" />
        <path d="M 120 30 L 120 210" stroke="#E03E2D" stroke-width="5" fill="none" stroke-linecap="round" />
        <circle cx="120" cy="100" r="12" fill="#FFC72C" stroke="#181716" stroke-width="2" />
        <text x="140" y="105" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" fill="#181716">THE BLUE DOOR</text>
        <text x="30" y="215" font-family="'Space Mono', monospace" font-size="8" fill="#888">VIENNA · CAFE PRÜCKEL · 2009</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>