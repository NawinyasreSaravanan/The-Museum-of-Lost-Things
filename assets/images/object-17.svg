  <circle cx="20" cy="20" r="2" fill="#2E8B82" />
  <circle cx="580" cy="20" r="2" fill="#2E8B82" />
  <circle cx="20" cy="430" r="2" fill="#2E8B82" />
  <circle cx="580" cy="430" r="2" fill="#2E8B82" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 17</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#2E8B82" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2012</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Carved Knight 2012 -->
      <g filter="url(#shadow-17)" transform="translate(210, 100)">
        <path d="M 60 210 L 140 210 L 135 180 C 130 160, 145 130, 130 100 C 120 80, 110 50, 90 40 C 70 30, 50 50, 45 70 C 40 90, 55 100, 65 105 C 50 115, 50 140, 55 180 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
        <circle cx="65" cy="72" r="3" fill="#38BDF8" />
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
