<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-14" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-14" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-14)" />
  <rect width="600" height="450" fill="url(#grid-14)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#2E8B82" />
  <circle cx="580" cy="20" r="2" fill="#2E8B82" />
  <circle cx="20" cy="430" r="2" fill="#2E8B82" />
  <circle cx="580" cy="430" r="2" fill="#2E8B82" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 14</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#2E8B82" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2006</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Silk Bandana 2006 -->
      <g filter="url(#shadow-14)" transform="translate(180, 100) rotate(3)">
        <polygon points="10,20 230,0 250,220 20,240" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
        <path d="M 50 50 Q 130 90 210 50" stroke="#38BDF8" stroke-width="3" fill="none" />
        <circle cx="130" cy="120" r="25" fill="none" stroke="#F43F5E" stroke-width="2" />
        <text x="130" y="125" font-family="'Space Mono', monospace" font-size="8" fill="#FFF" text-anchor="middle">SOHO 2006</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>