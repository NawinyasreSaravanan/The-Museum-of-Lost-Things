<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-13" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-13" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-13)" />
  <rect width="600" height="450" fill="url(#grid-13)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#E03E2D" />
  <circle cx="580" cy="20" r="2" fill="#E03E2D" />
  <circle cx="20" cy="430" r="2" fill="#E03E2D" />
  <circle cx="580" cy="430" r="2" fill="#E03E2D" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 13</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#E03E2D" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2016</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Kyoto Hotel Keycard 2016 -->
      <g filter="url(#shadow-13)" transform="translate(170, 120) rotate(-5)">
        <rect x="0" y="0" width="260" height="160" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
        <rect x="0" y="24" width="260" height="32" fill="#E2E8F0" />
        <text x="25" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" letter-spacing="3">HOTEL ANTEROOM</text>
        <text x="25" y="105" font-family="'Space Mono', monospace" font-size="9" fill="#94A3B8">KYOTO · JAPAN · 2016</text>
        <text x="235" y="135" font-family="'Space Mono', monospace" font-size="24" font-weight="bold" fill="#38BDF8" text-anchor="end">408</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>