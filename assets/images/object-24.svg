<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-24" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-24" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-24)" />
  <rect width="600" height="450" fill="url(#grid-24)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#2E8B82" />
  <circle cx="580" cy="20" r="2" fill="#2E8B82" />
  <circle cx="20" cy="430" r="2" fill="#2E8B82" />
  <circle cx="580" cy="430" r="2" fill="#2E8B82" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 24</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#2E8B82" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2022</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Polaroid of Empty Chair 2022 -->
      <g filter="url(#shadow-24)" transform="translate(190, 85) rotate(2)">
        <rect x="0" y="0" width="220" height="260" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
        <rect x="18" y="18" width="184" height="184" fill="#0F172A" />
        <!-- Solitary chair -->
        <g stroke="#38BDF8" stroke-width="2.5" fill="none">
          <line x1="85" y1="110" x2="85" y2="170" />
          <line x1="135" y1="110" x2="135" y2="170" />
          <path d="M 85 110 Q 110 95 135 110" />
          <rect x="85" y="130" width="50" height="10" rx="2" fill="#0284C7" />
        </g>
        <text x="110" y="235" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="13" fill="#475569" text-anchor="middle">“He was here a minute ago.”</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>