<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-06" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-06" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-06)" />
  <rect width="600" height="450" fill="url(#grid-06)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#E03E2D" />
  <circle cx="580" cy="20" r="2" fill="#E03E2D" />
  <circle cx="20" cy="430" r="2" fill="#E03E2D" />
  <circle cx="580" cy="430" r="2" fill="#E03E2D" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 06</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#E03E2D" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2005</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Retro Flip Phone 2005 -->
      <g filter="url(#shadow-06)" transform="translate(200, 95) rotate(-6)">
        <rect x="0" y="0" width="110" height="230" rx="20" fill="#292827" stroke="#151413" stroke-width="2.5" />
        <line x1="0" y1="115" x2="110" y2="115" stroke="#444" stroke-width="3" />
        <!-- External display & lens -->
        <rect x="25" y="25" width="60" height="50" rx="4" fill="#0C1B2A" stroke="#485A6C" stroke-width="1.5" />
        <text x="55" y="48" font-family="'Space Mono', monospace" font-size="10" fill="#44DBB5" text-anchor="middle">18:42</text>
        <text x="55" y="64" font-family="'Space Mono', monospace" font-size="7" fill="#44DBB5" text-anchor="middle">1 NEW MSG</text>
        <circle cx="55" cy="95" r="5" fill="#1C2E3D" stroke="#555" />
        <circle cx="55" cy="170" r="18" fill="#3D3C3A" stroke="#222" stroke-width="1" />
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>