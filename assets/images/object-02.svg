<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="shadow-02" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#121110" flood-opacity="0.16" />
    </filter>
    <linearGradient id="grad-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EDE2" />
    </linearGradient>
    <pattern id="grid-02" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#E5DEC9" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#grad-02)" />
  <rect width="600" height="450" fill="url(#grid-02)" opacity="0.5" />

  <!-- Modern Gallery Frame -->
  <rect x="20" y="20" width="560" height="410" fill="none" stroke="#D8CFBD" stroke-width="1" />
  <circle cx="20" cy="20" r="2" fill="#2D68C4" />
  <circle cx="580" cy="20" r="2" fill="#2D68C4" />
  <circle cx="20" cy="430" r="2" fill="#2D68C4" />
  <circle cx="580" cy="430" r="2" fill="#2D68C4" />

  <!-- Metadata Header -->
  <text x="36" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#887E6E" letter-spacing="2">FOUND · ARTIFACT № 02</text>
  <text x="564" y="38" font-family="'Space Mono', monospace" font-size="10" fill="#2D68C4" font-weight="bold" text-anchor="end" letter-spacing="1.5">EPOCH 2008</text>

  <!-- Graphic Centerpiece -->
  <g id="specimen-graphic">
    
      <!-- Tokyo Metro Card 2008 -->
      <g filter="url(#shadow-02)" transform="translate(160, 115) rotate(3)">
        <rect x="0" y="0" width="270" height="170" rx="8" fill="#F5F7FA" stroke="#2D68C4" stroke-width="2" />
        <rect x="0" y="0" width="270" height="36" rx="8" fill="#2D68C4" />
        <text x="20" y="24" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#FFFFFF" letter-spacing="2">PASMO / METRO</text>
        <circle cx="235" cy="18" r="8" fill="#FFC72C" />
        <!-- IC Chip simulation -->
        <rect x="25" y="55" width="45" height="35" rx="4" fill="#D4AF37" stroke="#A88B2A" stroke-width="1" />
        <text x="25" y="120" font-family="'Space Mono', monospace" font-size="16" font-weight="bold" fill="#181716">SHIBUYA → GINZA</text>
        <text x="25" y="145" font-family="'Space Mono', monospace" font-size="9" fill="#758A99">VALID: 14.10.2008 · FARE: 190 JPY</text>
      </g>
    
  </g>

  <!-- Footer Scale -->
  <g transform="translate(36, 420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#B0A694" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#B0A694" stroke-width="1.5" />
    <text x="90" y="4" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E">1:1 DIGITAL RECONSTRUCTION</text>
  </g>
  <text x="564" y="424" font-family="'Space Mono', monospace" font-size="8.5" fill="#887E6E" text-anchor="end" letter-spacing="1">AUTHENTIC RECOVERY</text>
</svg>